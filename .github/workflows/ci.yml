name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck --severity=warning install.sh uninstall.sh bin/* lib/*.sh scripts/*.sh
      - name: bash -n
        run: |
          for f in install.sh uninstall.sh bin/* lib/*.sh scripts/*.sh; do
            bash -n "$f" && echo "ok: $f"
          done

  macos:
    name: macOS (bash 3.2 + Swift build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse with /bin/bash (macOS ships 3.2)
        run: |
          /bin/bash --version | head -1
          for f in install.sh uninstall.sh bin/* lib/*.sh scripts/*.sh; do
            /bin/bash -n "$f" && echo "ok: $f"
          done

      - name: Build the app
        run: |
          swiftc --version
          swiftc -O -parse-as-library -o /tmp/DevStack app/main.swift -framework SwiftUI -framework AppKit
          test -x /tmp/DevStack && echo "app builds"

      - name: Generate icon and banner (original vector assets)
        run: |
          swiftc -O -o /tmp/makeicon app/makeicon.swift -framework AppKit
          /tmp/makeicon /tmp/icon.png
          test -s /tmp/icon.png && echo "icon renders"
          swiftc -O -o /tmp/makebanner app/makebanner.swift -framework AppKit
          /tmp/makebanner /tmp/banner.png
          test -s /tmp/banner.png && echo "banner renders"

      - name: Installer dry-run (must change nothing)
        run: |
          ./install.sh --dry-run --no-brew --no-helper
          echo "dry-run exit: $?"

      - name: Update check (offline fixture)
        run: |
          printf '%s' '{"tag_name":"v0.0.1","html_url":"https://github.com/itsmeshafat/dev-stack/releases/tag/v0.0.1","prerelease":false}' > /tmp/api.json
          DEVSTACK_UPDATE_API=file:///tmp/api.json bash bin/devstack update --check --json | python3 -m json.tool

  windows:
    name: Windows (PowerShell + .NET build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: PSScriptAnalyzer (errors only)
        shell: powershell
        run: |
          $files = Get-ChildItem -Recurse -Path windows -Include *.ps1,*.psm1 -File
          # NOTE: Invoke-ScriptAnalyzer's -Path is a single path in this version, so run per file.
          $results = @()
          foreach ($f in $files) {
            $results += Invoke-ScriptAnalyzer -Path $f.FullName -Severity Error
          }
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no errors"

      - name: Parse all PowerShell scripts
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Path windows -Include *.ps1,*.psm1 -File | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $bad++
              Write-Host "FAIL $($_.Name)"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "all scripts parse"

      - name: Build the app (in-box csc, no SDK)
        shell: powershell
        run: |
          $out = Join-Path $env:TEMP 'devstack-app-build'
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\app\build-app.ps1 -OutDir $out
          if (-not (Test-Path (Join-Path $out 'DevStack.exe'))) { Write-Host 'app build missing exe'; exit 1 }
          Write-Host 'app built'

      - name: Installer dry-run (must change nothing)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows\install.ps1 -DryRun -NoScoop -Yes

      - name: Update check (offline fixture)
        shell: powershell
        run: |
          $fixture = Join-Path $env:TEMP 'devstack-api.json'
          '{"tag_name":"v0.0.1","html_url":"https://github.com/itsmeshafat/dev-stack/releases/tag/v0.0.1","prerelease":false}' | Set-Content -LiteralPath $fixture -Encoding ASCII
          $env:DEVSTACK_UPDATE_API = $fixture
          $json = powershell -NoProfile -ExecutionPolicy Bypass -File windows\devstack.ps1 update --check --json
          $json | Write-Host
          $obj = $json | ConvertFrom-Json
          if ($obj.current -ne '1.6.0') { exit 1 }
          Write-Host "update check OK"
